<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Edward Mawela</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F4EEE3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13110E" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function () {
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      d.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="section not-found">
    <div class="container">
      <p class="kicker mono">Error 404</p>
      <h1>This page doesn't exist.</h1>
      <p class="section-intro">The link may be broken or the page may have moved. Everything about Edward is on the home page.</p>
      <div class="contact-actions">
        <a class="btn btn-primary" href="/">Go to the home page</a>
        <a class="btn btn-ghost" href="/#contact">Contact Edward</a>
      </div>
    </div>
  </main>
</body>
</html>
